name: Deploy Marp Slides to Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Compile presentation to site/index.html
        run: |
          mkdir -p site
          cp qrcode.png content_analysis_chart.png experimental_chart.png site/
          npx -y @marp-team/marp-cli@latest presentation.md -o site/index.html --allow-local-files

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
